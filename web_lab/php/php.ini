; ==============================================================================
; HARDENING DE RUNTIME PHP - DEFESA EM PROFUNDIDADE (CONFORMIDADE APD)
; ==============================================================================

; MÓDULO 1: Bloqueio estrito de funcoes de execucao de comandos no SO (Mitigacao de RCE)
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,show_source

; MÓDULO 2: Isolamento do sistema de ficheiros (Jaula/Sandbox para mitigar LFI)
open_basedir = "/var/www/html/:/tmp/"

; MÓDULO 3: Bloqueio de abertura e inclusao de URLs remotas (Mitigacao de RFI)
allow_url_fopen = Off
allow_url_include = Off

; MÓDULO 4: Ocultacao do cabecalho X-Powered-By no Fingerprinting HTTP
expose_php = Off

; MÓDULO 5: Exibicao de erros ativa para validacao visual no laboratorio
display_errors = On
