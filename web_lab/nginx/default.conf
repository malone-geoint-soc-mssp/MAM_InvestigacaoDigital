server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    # MÓDULO 1: Bloqueio defensivo contra descarregamento de logs, scripts e configuracoes
    location ~* \.(log|ini|sh|sql)$ {
        deny all;
        return 403;
    }

    # MÓDULO 2: Roteamento FastCGI para o container isolado php_lab_app
    location ~ \.php$ {
        include fastcgi_params;
        # Comunica com o container PHP-FPM na porta interna 9000
        fastcgi_pass php_lab_app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
